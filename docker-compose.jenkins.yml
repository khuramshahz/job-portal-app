version: '3.8'

services:
  # Web Application Service - Using volume instead of build
  web:
    image: node:18-alpine
    container_name: jenkins-job-portal-web
    restart: always
    working_dir: /app
    command: sh -c "npm install --production && node index.js"
    ports:
      - "8081:5000"  # Different port
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/job-application
      - JWT_SECRET=your_jwt_secret_key_here
      - NODE_ENV=production
    volumes:
      # Volume for code instead of Dockerfile build
      - ./server:/app
      - ./client/dist:/app/public
      - web-node-modules:/app/node_modules
    depends_on:
      - mongo
    networks:
      - jenkins-job-portal-network

  # MongoDB Database Service with Persistent Volume
  mongo:
    image: mongo:7.0
    container_name: jenkins-job-portal-mongo
    restart: always
    ports:
      - "27018:27017"  # Different port
    environment:
      - MONGO_INITDB_DATABASE=job-application
    volumes:
      # Named volume for data persistence
      - jenkins-mongo-data:/data/db
    networks:
      - jenkins-job-portal-network

# Named volumes for data persistence
volumes:
  jenkins-mongo-data:
    driver: local
  web-node-modules:
    driver: local

# Network for service communication
networks:
  jenkins-job-portal-network:
    driver: bridge

