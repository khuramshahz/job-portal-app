apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-portal-web
  labels:
    app: job-portal-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-portal-web
  template:
    metadata:
      labels:
        app: job-portal-web
    spec:
      containers:
        - name: job-portal-web
          image: khuramshahz/job-portal-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: "mongodb://job-portal-db:27017/job-portal"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
